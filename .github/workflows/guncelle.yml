name: Ilanlari guncelle

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/guncelle.yml"
      - "ek_kaynaklar.json"
      - "requirements.txt"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OCR araclarini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tur
      - run: pip install -r requirements.txt
      - name: Kod ve veri dosyalarini dogrula
        run: |
          python -m compileall -q .
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("ek_kaynaklar.json", "ilanlar.json", "manuel_ilanlar.json"):
              path = Path(name)
              if path.exists():
                  with path.open(encoding="utf-8-sig") as f:
                      data = json.load(f)
                  print(f"{name}: JSON OK")
          PY
      - name: KPSS puan ayristirma testi
        run: |
          python - <<'PY'
          from ayristir import parse_puan_tablosu, parse_min_kpss
          ornek = """
          Kadro Unvani: Insaat Muhendisi
          Kadro Sayisi: 3
          KPSS Puan Turu: KPSSP3
          Giris sinavi genel basvuru sartlari:
          KPSSP3 puan turunden en az 70 puan almis olmak.
          """
          puanlar = parse_puan_tablosu(ornek)
          assert puanlar.get("P3") == 70.0, puanlar
          assert parse_min_kpss(ornek) == 70.0
          tablo = parse_puan_tablosu("KPSS P93 EN AZ 65 PUAN")
          assert tablo.get("P93") == 65.0, tablo
          print("KPSS puan testleri: OK")
          PY
      - name: Yanlis duyuru filtreleme testi
        run: |
          python - <<'PY'
          from ilan_cek_web import ilan_disi_temizle
          kayitlar = {
              "sonuc": {"title": "29 Mart 2023 Çalışma Uzman Yardımcılığı Giriş Sınavı Sonuçları Duyuru", "institution": "Çalışma ve Sosyal Güvenlik Bakanlığı", "source_name": "Çalışma ve Sosyal Güvenlik Bakanlığı"},
              "turmob": {"title": "TÜRMOB'dan Yeminli Mali Müşavirlik Sınav Duyurusu", "institution": "TÜRMOB", "source_name": "ilan.gov.tr"},
              "puan_duyuru": {"title": "Aile Bakanlığı Sözleşmeli Personel Alımı Taban ve Tavan Puanları Hakkında Duyuru", "institution": "Aile ve Sosyal Hizmetler Bakanlığı", "source_name": "Aile ve Sosyal Hizmetler Bakanlığı"},
              "sinav_tarihi": {"title": "Çalışma Uzman Yardımcılığı Giriş Sınavı Sınav Tarihi ve Yeri Duyuru", "institution": "Çalışma ve Sosyal Güvenlik Bakanlığı", "source_name": "Çalışma ve Sosyal Güvenlik Bakanlığı"},
              "eski_alim": {"title": "02 Aralık 2022 Aile ve Sosyal Hizmetler Bakanlığı Sözleşmeli Personel Alım İlanı", "institution": "Aile ve Sosyal Hizmetler Bakanlığı", "source_name": "Aile ve Sosyal Hizmetler Bakanlığı"},
              "guncel_mufettis": {"title": "Sosyal Güvenlik Kurumu Müfettiş Yardımcılığı Giriş Sınavı İlanı", "institution": "Sosyal Güvenlik Kurumu", "source_name": "ilan.gov.tr"}
          }
          cikarilan = ilan_disi_temizle(kayitlar)
          assert cikarilan == 4, (cikarilan, kayitlar)
          assert "eski_alim" in kayitlar and kayitlar["eski_alim"].get("durum") == "arsiv"
          assert "guncel_mufettis" in kayitlar
          print("Yanlış duyuru filtreleri: OK")
          PY
      - run: python ilan_cek_web.py
      - name: Yapay zeka ilan okuma
        timeout-minutes: 6
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
        run: python ai_analiz.py
      - run: python sayfa_uret.py
      - name: Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_KANAL: ${{ secrets.TELEGRAM_KANAL }}
        run: python telegram_gonder.py
      - name: Degisiklik varsa kaydet
        run: |
          git config user.name "kamuradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Ilanlar guncellendi" && git pull --rebase origin main && git push)
