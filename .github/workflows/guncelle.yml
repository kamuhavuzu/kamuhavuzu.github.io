name: Ilanlari guncelle

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/guncelle.yml"
      - "ek_kaynaklar.json"
      - "requirements.txt"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OCR araclarini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tur
      - run: pip install -r requirements.txt
      - name: Kod ve veri dosyalarini dogrula
        run: |
          python -m compileall -q .
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("ek_kaynaklar.json", "ilanlar.json", "manuel_ilanlar.json"):
              path = Path(name)
              if path.exists():
                  with path.open(encoding="utf-8-sig") as f:
                      data = json.load(f)
                  print(f"{name}: JSON OK")
          PY
      - name: KPSS puan ayristirma testi
        run: |
          python - <<'PY'
          from ayristir import parse_puan_tablosu, parse_min_kpss
          ornek = """
          Kadro Unvani: Insaat Muhendisi
          Kadro Sayisi: 3
          KPSS Puan Turu: KPSSP3
          Giris sinavi genel basvuru sartlari:
          KPSSP3 puan turunden en az 70 puan almis olmak.
          """
          puanlar = parse_puan_tablosu(ornek)
          assert puanlar.get("P3") == 70.0, puanlar
          assert parse_min_kpss(ornek) == 70.0
          tablo = parse_puan_tablosu("KPSS P93 EN AZ 65 PUAN")
          assert tablo.get("P93") == 65.0, tablo
          # PDF/HTML tablo metninde KPSS puan turu ile esik arasinda
          # 1200 karakterden fazla bosluk olsa da ayni tur eslesmeli.
          uzak = "KPSS P93" + (" TABLO SATIRI" * 140) + " EN AZ 68 PUAN"
          assert parse_puan_tablosu(uzak).get("P93") == 68.0, parse_puan_tablosu(uzak)
          # Farkli puan turunun esigi onceki turle karistirilmamali.
          ayri = "KPSS P93" + (" A" * 80) + " KPSS P3 EN AZ 75 PUAN"
          assert parse_puan_tablosu(ayri).get("P93") is None, parse_puan_tablosu(ayri)
          assert parse_puan_tablosu(ayri).get("P3") == 75.0, parse_puan_tablosu(ayri)
          # Sahil Guvenlik kilavuzundaki KPSSP03 ASGARI 60 tablo ifadesi.
          p03 = "2026 YILI KPSSP03 ASGARI 60"
          assert parse_puan_tablosu(p03).get("P3") == 60.0, parse_puan_tablosu(p03)
          assert parse_min_kpss(p03) == 60.0, parse_min_kpss(p03)
          print("KPSS puan testleri: OK")
          PY
      - name: Yanlis duyuru filtreleme testi
        run: |
          python - <<'PY'
          from ilan_cek_web import ilan_disi_temizle
          kayitlar = {
              "sonuc": {"title": "29 Mart 2023 Çalışma Uzman Yardımcılığı Giriş Sınavı Sonuçları Duyuru", "institution": "Çalışma ve Sosyal Güvenlik Bakanlığı", "source_name": "Çalışma ve Sosyal Güvenlik Bakanlığı"},
              "turmob": {"title": "TÜRMOB'dan Yeminli Mali Müşavirlik Sınav Duyurusu", "institution": "TÜRMOB", "source_name": "ilan.gov.tr"},
              "puan_duyuru": {"title": "Aile Bakanlığı Sözleşmeli Personel Alımı Taban ve Tavan Puanları Hakkında Duyuru", "institution": "Aile ve Sosyal Hizmetler Bakanlığı", "source_name": "Aile ve Sosyal Hizmetler Bakanlığı"},
              "sinav_tarihi": {"title": "Çalışma Uzman Yardımcılığı Giriş Sınavı Sınav Tarihi ve Yeri Duyuru", "institution": "Çalışma ve Sosyal Güvenlik Bakanlığı", "source_name": "Çalışma ve Sosyal Güvenlik Bakanlığı"},
              "eski_alim": {"title": "02 Aralık 2022 Aile ve Sosyal Hizmetler Bakanlığı Sözleşmeli Personel Alım İlanı", "institution": "Aile ve Sosyal Hizmetler Bakanlığı", "source_name": "Aile ve Sosyal Hizmetler Bakanlığı"},
              "guncel_mufettis": {"title": "Sosyal Güvenlik Kurumu Müfettiş Yardımcılığı Giriş Sınavı İlanı", "institution": "Sosyal Güvenlik Kurumu", "source_name": "ilan.gov.tr"}
          }
          cikarilan = ilan_disi_temizle(kayitlar)
          assert cikarilan == 4, (cikarilan, kayitlar)
          assert "eski_alim" in kayitlar and kayitlar["eski_alim"].get("durum") == "arsiv"
          assert "guncel_mufettis" in kayitlar
          print("Yanlış duyuru filtreleri: OK")
          PY
      - run: python ilan_cek_web.py
      - name: Yapay zeka ilan okuma
        timeout-minutes: 6
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
        run: python ai_analiz.py
      - run: python sayfa_uret.py
      - name: Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_KANAL: ${{ secrets.TELEGRAM_KANAL }}
        run: python telegram_gonder.py
      - name: Degisiklik varsa kaydet
        run: |
          git config user.name "kamuhavuzu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Ilanlar guncellendi"
            if ! git pull --rebase origin main; then
              echo "ilanlar.json cakismasi bulundu; iki veri kumesi birlestiriliyor."
              python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def read_stage(stage):
              raw = subprocess.check_output(["git", "show", f":{stage}:ilanlar.json"])
              return json.loads(raw.decode("utf-8-sig"))

          try:
              remote = read_stage(2)  # rebase'in yeni main surumu
              scanned = read_stage(3) # bu calismanin taradigi surum
          except Exception as exc:
              raise SystemExit(f"JSON cakisma surumleri okunamadi: {exc}")

          def key(row):
              if not isinstance(row, dict):
                  return None
              for field in ("id", "link", "url", "source_url"):
                  value = row.get(field)
                  if value:
                      return f"{field}:{value}"
              return None

          def merge(a, b):
              if isinstance(a, dict) and isinstance(b, dict):
                  out = dict(a)
                  for k, v in b.items():
                      out[k] = merge(out[k], v) if k in out else v
                  return out
              if isinstance(a, list) and isinstance(b, list):
                  if all(isinstance(x, dict) for x in a + b):
                      out, positions = [], {}
                      for item in a + b:
                          ident = key(item)
                          if ident is not None and ident in positions:
                              idx = positions[ident]
                              out[idx] = merge(out[idx], item)
                          else:
                              if ident is not None:
                                  positions[ident] = len(out)
                              out.append(item)
                      return out
                  out = list(a)
                  for item in b:
                      if item not in out:
                          out.append(item)
                  return out
              # Taranan surumun dolu/yeni bilgisi tercih edilir; bos alan
              # remote main'deki mevcut degeri silmez.
              return b if b not in (None, "", [], {}) else a

          merged = merge(remote, scanned)
          Path("ilanlar.json").write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("JSON birlestirildi; ana daldaki ilanlar ve yeni tarama korunuyor.")
          PY
              git add ilanlar.json
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:main
          fi
