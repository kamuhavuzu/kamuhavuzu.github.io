name: Ilanlari guncelle

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: guncelle

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ilan_cek_web.py
      - run: python sayfa_uret.py
      - name: Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_KANAL: ${{ secrets.TELEGRAM_KANAL }}
        run: python telegram_gonder.py
      - name: Degisiklik varsa kaydet
        run: |
          git config user.name "kamuradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Ilanlar guncellendi" && git push)
